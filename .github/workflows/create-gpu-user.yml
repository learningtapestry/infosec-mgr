name: Create GPU Experiment IAM Users

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - show-creds
          - destroy
      encryption_key:
        description: 'Passphrase to encrypt credentials (for show-creds)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: infosec-mgr-backups-866795125297
  S3_KEY: gpu-credentials/all-credentials.enc

jobs:
  terraform:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Import existing resources
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          # Import any existing resources so terraform doesn't try to recreate them
          # These may or may not exist from prior workflow runs
          terraform import aws_iam_user.gpu_scoped vector-traversal-gpu 2>/dev/null || true
          terraform import aws_iam_user.gpu_admin vector-traversal-admin 2>/dev/null || true
          # Access keys and policies can't be easily imported, terraform will recreate them

      - name: Terraform Plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          terraform plan \
            -target=aws_iam_user.gpu_scoped \
            -target=aws_iam_access_key.gpu_scoped \
            -target=aws_iam_user_policy.gpu_scoped \
            -target=aws_iam_user.gpu_admin \
            -target=aws_iam_access_key.gpu_admin \
            -target=aws_iam_user_policy_attachment.gpu_admin

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply -auto-approve \
            -target=aws_iam_user.gpu_scoped \
            -target=aws_iam_access_key.gpu_scoped \
            -target=aws_iam_user_policy.gpu_scoped \
            -target=aws_iam_user.gpu_admin \
            -target=aws_iam_access_key.gpu_admin \
            -target=aws_iam_user_policy_attachment.gpu_admin

          echo ""
          echo "=== Apply complete. Run 'show-creds' to export credentials ==="

      - name: Export credentials
        if: inputs.action == 'show-creds'
        env:
          ENCRYPTION_KEY: ${{ inputs.encryption_key }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          SCOPED_AK=$(terraform output -raw gpu_scoped_access_key_id 2>/dev/null || echo "NOT_FOUND")
          SCOPED_SK=$(terraform output -raw gpu_scoped_secret_key 2>/dev/null || echo "NOT_FOUND")
          ADMIN_AK=$(terraform output -raw gpu_admin_access_key_id 2>/dev/null || echo "NOT_FOUND")
          ADMIN_SK=$(terraform output -raw gpu_admin_secret_key 2>/dev/null || echo "NOT_FOUND")

          if [ "${SCOPED_AK}" = "NOT_FOUND" ] || [ "${ADMIN_AK}" = "NOT_FOUND" ]; then
            echo "ERROR: Credentials not found in terraform state."
            echo "Run 'apply' first to create the resources."
            exit 1
          fi

          cat > /tmp/creds.txt << EOF
          # AWS Credentials — Account ${ACCOUNT_ID} (us-east-1)
          # Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          [vector-traversal-gpu]
          # Scoped: EC2 + S3 (vector-traversal-* buckets)
          aws_access_key_id = ${SCOPED_AK}
          aws_secret_access_key = ${SCOPED_SK}
          region = us-east-1

          [vector-traversal-admin]
          # FULL ADMIN — AdministratorAccess
          aws_access_key_id = ${ADMIN_AK}
          aws_secret_access_key = ${ADMIN_SK}
          region = us-east-1

          [infosec-deployer]
          # GitHub Actions deployer (from repo secrets)
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          region = us-east-1
          EOF

          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
            -in /tmp/creds.txt -out /tmp/creds.enc \
            -pass "pass:${ENCRYPTION_KEY}"

          aws s3 cp /tmp/creds.enc "s3://${S3_BUCKET}/${S3_KEY}"
          rm -f /tmp/creds.txt /tmp/creds.enc

          echo "Encrypted credentials uploaded to s3://${S3_BUCKET}/${S3_KEY}"
          echo "Run 'make-public' to download (TODO: add that action)"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform import aws_iam_user.gpu_scoped vector-traversal-gpu 2>/dev/null || true
          terraform import aws_iam_user.gpu_admin vector-traversal-admin 2>/dev/null || true

          terraform destroy -auto-approve \
            -target=aws_iam_access_key.gpu_scoped \
            -target=aws_iam_user_policy.gpu_scoped \
            -target=aws_iam_access_key.gpu_admin \
            -target=aws_iam_user_policy_attachment.gpu_admin \
            -target=aws_iam_user.gpu_scoped \
            -target=aws_iam_user.gpu_admin

          aws s3 rm "s3://${S3_BUCKET}/${S3_KEY}" 2>/dev/null || true
          echo "=== Cleanup complete ==="
