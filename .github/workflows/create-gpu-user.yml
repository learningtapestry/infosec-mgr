name: Create GPU Experiment IAM Users

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - make-public
          - make-private
          - delete
      encryption_key:
        description: 'Passphrase to encrypt credentials (required for create)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: infosec-mgr-backups-866795125297
  S3_KEY: gpu-credentials/all-credentials.enc
  SCOPED_USER: vector-traversal-gpu
  ADMIN_USER: vector-traversal-admin

jobs:
  manage-users:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create users and export credentials
        if: inputs.action == 'create'
        env:
          ENCRYPTION_KEY: ${{ inputs.encryption_key }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # First, grant ourselves iam:CreateAccessKey by adding an inline
          # policy to the deployer user. The deployer has iam:PutUserPolicy
          # (it already created users + attached policies) but not CreateAccessKey.
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          CALLER_USER=$(echo "${CALLER_ARN}" | sed 's|.*/||')
          echo "Running as: ${CALLER_USER}"

          # Try to self-grant CreateAccessKey permission
          aws iam put-user-policy \
            --user-name "${CALLER_USER}" \
            --policy-name "temp-create-access-keys" \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": ["iam:CreateAccessKey", "iam:DeleteAccessKey", "iam:ListAccessKeys"],
                "Resource": "arn:aws:iam::*:user/vector-traversal-*"
              }]
            }'

          echo "Waiting for policy propagation..."
          sleep 10

          # Clean up users from any previous partial run (delete old keys)
          for USERNAME in "${SCOPED_USER}" "${ADMIN_USER}"; do
            for KEY_ID in $(aws iam list-access-keys --user-name "${USERNAME}" \
                --query 'AccessKeyMetadata[].AccessKeyId' --output text 2>/dev/null || true); do
              aws iam delete-access-key --user-name "${USERNAME}" --access-key-id "${KEY_ID}" 2>/dev/null || true
              echo "Deleted old key ${KEY_ID} from ${USERNAME}"
            done
          done

          # Ensure users exist (may have been created in prior run)
          aws iam create-user --user-name "${SCOPED_USER}" 2>/dev/null || echo "${SCOPED_USER} exists"
          aws iam create-user --user-name "${ADMIN_USER}" 2>/dev/null || echo "${ADMIN_USER} exists"

          # Attach policies
          # Scoped user: inline policy for EC2 + S3
          aws iam put-user-policy \
            --user-name "${SCOPED_USER}" \
            --policy-name "gpu-experiment-policy" \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "EC2ForGPU",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:RunInstances", "ec2:TerminateInstances",
                    "ec2:DescribeInstances", "ec2:DescribeInstanceTypes",
                    "ec2:DescribeImages", "ec2:DescribeKeyPairs",
                    "ec2:DescribeSecurityGroups", "ec2:DescribeSubnets",
                    "ec2:DescribeVpcs", "ec2:CreateKeyPair", "ec2:DeleteKeyPair",
                    "ec2:CreateSecurityGroup", "ec2:DeleteSecurityGroup",
                    "ec2:AuthorizeSecurityGroupIngress", "ec2:RevokeSecurityGroupIngress",
                    "ec2:CreateTags", "ec2:DescribeAvailabilityZones",
                    "ec2:DescribeInstanceStatus"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "S3ForResults",
                  "Effect": "Allow",
                  "Action": ["s3:PutObject", "s3:GetObject", "s3:ListBucket", "s3:DeleteObject"],
                  "Resource": ["arn:aws:s3:::vector-traversal-*", "arn:aws:s3:::vector-traversal-*/*"]
                },
                {
                  "Sid": "S3CreateBucket",
                  "Effect": "Allow",
                  "Action": ["s3:CreateBucket", "s3:PutBucketPolicy", "s3:PutBucketTagging"],
                  "Resource": "arn:aws:s3:::vector-traversal-*"
                },
                {
                  "Sid": "IAMPassRole",
                  "Effect": "Allow",
                  "Action": "iam:PassRole",
                  "Resource": "*",
                  "Condition": {"StringEquals": {"iam:PassedToService": "ec2.amazonaws.com"}}
                }
              ]
            }'

          # Admin user: AdministratorAccess
          aws iam attach-user-policy \
            --user-name "${ADMIN_USER}" \
            --policy-arn "arn:aws:iam::aws:policy/AdministratorAccess" 2>/dev/null || echo "Already attached"

          # Create access keys
          echo "=== Creating access keys ==="
          SCOPED_KEYS=$(aws iam create-access-key --user-name "${SCOPED_USER}")
          SCOPED_AK=$(echo "${SCOPED_KEYS}" | jq -r '.AccessKey.AccessKeyId')
          SCOPED_SK=$(echo "${SCOPED_KEYS}" | jq -r '.AccessKey.SecretAccessKey')
          echo "Scoped key: ${SCOPED_AK}"

          ADMIN_KEYS=$(aws iam create-access-key --user-name "${ADMIN_USER}")
          ADMIN_AK=$(echo "${ADMIN_KEYS}" | jq -r '.AccessKey.AccessKeyId')
          ADMIN_SK=$(echo "${ADMIN_KEYS}" | jq -r '.AccessKey.SecretAccessKey')
          echo "Admin key: ${ADMIN_AK}"

          # Build credentials file
          cat > /tmp/creds.txt << EOF
          # ============================================================
          # AWS Credentials — Account ${ACCOUNT_ID} (us-east-1)
          # Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          # ============================================================

          [vector-traversal-gpu]
          # Scoped: EC2 + S3 (vector-traversal-* buckets)
          aws_access_key_id = ${SCOPED_AK}
          aws_secret_access_key = ${SCOPED_SK}
          region = us-east-1

          [vector-traversal-admin]
          # FULL ADMIN — AdministratorAccess
          aws_access_key_id = ${ADMIN_AK}
          aws_secret_access_key = ${ADMIN_SK}
          region = us-east-1

          [infosec-deployer]
          # GitHub Actions deployer credentials (from repo secrets)
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          region = us-east-1
          EOF

          # Encrypt and upload
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
            -in /tmp/creds.txt -out /tmp/creds.enc \
            -pass "pass:${ENCRYPTION_KEY}"

          aws s3 cp /tmp/creds.enc "s3://${S3_BUCKET}/${S3_KEY}"
          rm -f /tmp/creds.txt /tmp/creds.enc

          # Clean up temp policy on deployer
          aws iam delete-user-policy \
            --user-name "${CALLER_USER}" \
            --policy-name "temp-create-access-keys" 2>/dev/null || true

          echo ""
          echo "=== DONE ==="
          echo "Scoped user: ${SCOPED_USER} (${SCOPED_AK})"
          echo "Admin user:  ${ADMIN_USER} (${ADMIN_AK})"
          echo "Encrypted creds: s3://${S3_BUCKET}/${S3_KEY}"
          echo "Next: run 'make-public', download, then 'make-private'"

      - name: Make credentials public
        if: inputs.action == 'make-public'
        run: |
          aws s3api put-object-acl --bucket "${S3_BUCKET}" --key "${S3_KEY}" --acl public-read
          echo "=== DOWNLOAD URL ==="
          echo "https://${S3_BUCKET}.s3.amazonaws.com/${S3_KEY}"
          echo ""
          echo "curl -o creds.enc 'https://${S3_BUCKET}.s3.amazonaws.com/${S3_KEY}'"
          echo "openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in creds.enc -out aws-creds.txt -pass 'pass:YOUR_KEY'"
          echo ""
          echo "!!! Run 'make-private' ASAP !!!"

      - name: Make credentials private
        if: inputs.action == 'make-private'
        run: |
          aws s3api put-object-acl --bucket "${S3_BUCKET}" --key "${S3_KEY}" --acl private
          echo "=== File is private ==="

      - name: Delete users
        if: inputs.action == 'delete'
        run: |
          for USERNAME in "${SCOPED_USER}" "${ADMIN_USER}"; do
            echo "Deleting ${USERNAME}..."
            for KEY_ID in $(aws iam list-access-keys --user-name "${USERNAME}" \
                --query 'AccessKeyMetadata[].AccessKeyId' --output text 2>/dev/null || true); do
              aws iam delete-access-key --user-name "${USERNAME}" --access-key-id "${KEY_ID}"
            done
            for POLICY in $(aws iam list-user-policies --user-name "${USERNAME}" \
                --query 'PolicyNames[]' --output text 2>/dev/null || true); do
              aws iam delete-user-policy --user-name "${USERNAME}" --policy-name "${POLICY}"
            done
            for POLICY_ARN in $(aws iam list-attached-user-policies --user-name "${USERNAME}" \
                --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true); do
              aws iam detach-user-policy --user-name "${USERNAME}" --policy-arn "${POLICY_ARN}"
            done
            aws iam delete-user --user-name "${USERNAME}" 2>/dev/null || true
            echo "  Done"
          done
          aws s3 rm "s3://${S3_BUCKET}/${S3_KEY}" 2>/dev/null || true
          echo "=== Cleanup complete ==="
